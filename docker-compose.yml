# ANX RaspTank robot sidecar — joins asset-node-ipc-docker (same architecture, not a second stack).
#
# Deploy order (required before this compose):
#   1. cd ../nexus-asset-example-docker-dev
#   2. Ensure COMPOSE_PROFILES includes oem (or oem-io)
#   3. ./prepare.sh          # generates MQTT_PASSWORD + data/mqtt/certs/ca.crt
#   4. docker compose up -d  # creates network anx-assets-ipc-network + Mosquitto
#   5. cd ../nexus-asset-pirobot-sidecar && ./up.sh
#
# Image is built from this directory on `docker compose up`. No registry pull.
# Bridge package lives in robot_control/anx-robot/anx_bridge (overlay); no second Mosquitto.

# 3 x 100MB = 300MB of json logs per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

services:
  anx-robot:
    logging: *default-logging
    build: .
    image: anx-robot-sidecar:local
    pull_policy: build
    container_name: anx-robot-sidecar
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ROBOT_CONTROL_PASSWORD=${ROBOT_CONTROL_PASSWORD:?set ROBOT_CONTROL_PASSWORD via ./prepare.sh}
      - ANX_ROBOT_WEB_DIR=/app
      - ANX_BRIDGE_ENABLED=${ANX_BRIDGE_ENABLED:-true}
      - ANX_CONTROL_SOURCE=${ANX_CONTROL_SOURCE:-auto}
      - ANX_DEADMAN_MS=${ANX_DEADMAN_MS:-500}
      - ANX_TOPIC_PREFIX=${ANX_TOPIC_PREFIX:-rasptank}
      - ANX_ARM_REST_DEG=${ANX_ARM_REST_DEG:-90}
      - MQTT_BROKER=${MQTT_BROKER:-mqtts://mqtt:8883}
      - MQTT_USER=${MQTT_USER:-anx}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?set MQTT_PASSWORD (same as ipc-docker oem)}
      - MQTT_CA_FILE=${MQTT_CA_FILE:-/certs/ca.crt}
      - ANX_ROBOT_TLS=${ANX_ROBOT_TLS:-true}
      - ANX_ROBOT_TLS_CERT=${ANX_ROBOT_TLS_CERT:-/certs/tls/robot.crt}
      - ANX_ROBOT_TLS_KEY=${ANX_ROBOT_TLS_KEY:-/certs/tls/robot.key}
    volumes:
      # CA generated by asset-node-ipc-docker prepare.sh (oem / oem-io profile)
      - ${IPC_MQTT_CERTS_DIR:-../nexus-asset-example-docker-dev/data/mqtt/certs}/ca.crt:/certs/ca.crt:ro
      # Self-signed UI/WS certs from ./up.sh (data/certs/robot.{crt,key})
      - ${ROBOT_TLS_DIR:-./data/certs}:/certs/tls:ro
      # libcamera discovers CSI cameras via udev; without this Picamera2 sees an empty list.
      - /run/udev:/run/udev:ro
    ports:
      # Flask camera UI + Adeept control WebSocket (UI connects to wss://<host>:8888 when TLS on).
      - "${ROBOT_HTTP_PORT:-5000}:5000"
      - "${ROBOT_WS_PORT:-8888}:8888"
    networks:
      - anx-assets-ipc-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,ssl,urllib.request; tls=os.environ.get('ANX_ROBOT_TLS','true').lower() in ('1','true','yes','on'); ctx=ssl._create_unverified_context() if tls else None; urllib.request.urlopen(('https' if tls else 'http')+'://127.0.0.1:5000/health', context=ctx, timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    # privileged lets the process open GPIO, I2C, and camera. It does not create
    # the device nodes. up.sh writes docker-compose.devices.yml for the host's
    # /dev/gpiochip* (lgpio), /dev/i2c-* (PCA9685), and /dev/video*+/dev/media*
    # (libcamera / Picamera2).
    privileged: true

networks:
  anx-assets-ipc-network:
    external: true
    name: ${IPC_DOCKER_NETWORK:-anx-assets-ipc-network}
